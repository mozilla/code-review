[project]
name = "code-review-integration"
# Not a distributable package (see tool.uv.package): the version is a placeholder,
# the integration VERSION file remains the source of truth.
version = "0"
description = "Integration tests for Mozilla code review"
requires-python = ">=3.14"
dependencies = [
    "mozphab==2.23.0",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "taskcluster==115.0.1",
]

[dependency-groups]
dev = [
    "json-e==4.8.4",
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20261122",
]

[tool.uv]
package = false

[tool.mypy]
cache_dir = ".mypy_cache/integration"

[[tool.mypy.overrides]]
# These dependencies ship neither type hints nor stubs
module = [
    "jsone.*",
    "taskcluster.*",
]
ignore_missing_imports = true
