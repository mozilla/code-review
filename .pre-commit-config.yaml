repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        exclude: fixtures|mocks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: trailing-whitespace
      - id: check-yaml
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--django"]
      - id: check-json
      - id: check-vcs-permalinks
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        exclude_types: [json, pem]
  - repo: https://github.com/marco-c/taskcluster_yml_validator
    rev: v0.0.13
    hooks:
      - id: taskcluster_yml
  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
  # mypy runs from the locked uv workspace env, so it type-checks against the
  # dependency versions we deploy. One hook per project keeps each project's
  # config (e.g. the Django plugin) scoped to its own files.
  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy (backend)
        entry: uv run --locked mypy --config-file=backend/pyproject.toml
        language: system
        types: [python]
        files: ^backend/
        exclude: ^backend/code_review_backend/issues/migrations/
        require_serial: true
      - id: mypy-bot
        name: mypy (bot)
        entry: uv run --locked mypy --config-file=bot/pyproject.toml
        language: system
        types: [python]
        files: ^bot/
        require_serial: true
      - id: mypy-integration
        name: mypy (integration)
        entry: uv run --locked mypy --config-file=integration/pyproject.toml
        language: system
        types: [python]
        files: ^integration/
        require_serial: true
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.33.0
    hooks:
      - id: django-upgrade

default_language_version:
  python: python3
