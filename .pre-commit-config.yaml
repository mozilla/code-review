repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        exclude: fixtures|mocks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: trailing-whitespace
      - id: check-yaml
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--django"]
      - id: check-json
      - id: requirements-txt-fixer
      - id: check-vcs-permalinks
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        exclude_types: [json, pem]
  - repo: https://github.com/marco-c/taskcluster_yml_validator
    rev: v0.0.13
    hooks:
      - id: taskcluster_yml
  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        entry: env DEBUG=false mypy
        args:
          [
            --config-file=pyproject.toml,
            --explicit-package-bases,
            --show-traceback,
          ]
        exclude: (^|/)(migrations/.*\.py|setup\.py|conftest\.py|test_stats\.py|test_workflow\.py)$
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-jsonschema
          - json-e==4.8.4
          - django
          - django-cors-headers
          - django-environ
          - djangorestframework
          - dockerflow
          - drf-yasg
          - parsepatch
          - sentry-sdk
          - structlog
          - taskcluster
          - pytest
          - django-stubs
          - djangorestframework-stubs
        pass_filenames: true
  - repo: meta
    hooks:
      - id: check-useless-excludes
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.32.0
    hooks:
      - id: django-upgrade

default_language_version:
  python: python3
