[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-review-backend"
dynamic = ["version"]
description = "Store and compare issues found in Mozilla code review tasks"
authors = [{ name = "Mozilla Engineering Workflow", email = "release-mgmt-analysis@mozilla.com" }]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "djangorestframework==3.18.1",
    "dockerflow==2026.3.4",
    "drf-yasg==1.21.15",
    "gunicorn==26.2.0",
    "parsepatch==0.1.3",
    "psycopg2-binary==2.9.13",
    "sentry-sdk==2.74.0",
    "sqlparse==0.6.0",
    "taskcluster==113.2.0",
    "tqdm==4.70.1",
    "whitenoise==6.12.0",
]

[project.urls]
Homepage = "https://github.com/mozilla/code-review"

[dependency-groups]
dev = [
    "django-debug-toolbar==8.0.0",
    "django-extensions==4.1",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.sdist]
include = ["/code_review_backend", "/VERSION"]

[tool.hatch.build.targets.wheel]
packages = ["code_review_backend"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]
