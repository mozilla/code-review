version: 2
updates:
  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 99
    labels:
      - tools
  - package-ecosystem: pip
    directory: "/integration"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 99
    labels:
      - integration
  - package-ecosystem: docker
    directory: "/bot/docker"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    open-pull-requests-limit: 99
    labels:
      - bot
  - package-ecosystem: docker
    directory: "/integration/docker"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    open-pull-requests-limit: 99
  - package-ecosystem: docker
    directory: "/backend/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 99
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 99
    labels:
      - frontend
  - package-ecosystem: pip
    directory: "/bot"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 99
    labels:
      - bot
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 99
    labels:
      - backend
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    groups:
      patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
    open-pull-requests-limit: 99
